<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- IntelliGenda — Incastro Perfetto del Tempo -->
  <!-- Outer circle -->
  <circle cx="16" cy="16" r="14.5" stroke="#1c1917" stroke-width="1.5" fill="none"/>
  <!-- Inner arc — time slot (upper-right quadrant, 90°) -->
  <path d="M16 3.5 A12.5 12.5 0 0 1 28.5 16" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- 45° diagonal line — precision cut -->
  <line x1="5" y1="27" x2="27" y2="5" stroke="#1c1917" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot — interlocking anchor point -->
  <circle cx="16" cy="16" r="2" fill="#1c1917"/>
</svg>
